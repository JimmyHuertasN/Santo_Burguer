<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Santo Burger | Menú</title>
<meta name="description" content="Menú digital de Santo Burger. Burger, Grill and Fries.">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="grain"></div>

<header class="hero">
  <div class="hero-glow" aria-hidden="true"></div>
  <div class="brand" aria-label="Santo Burger, Burger Grill and Fries">
    <span class="brand-halo" aria-hidden="true"></span>
    <span class="brand-eyebrow">Burger · Grill · Fries</span>
    <span class="brand-name"><span>Santo</span> Burger</span>
    <span class="brand-rule" aria-hidden="true"></span>
    <span class="brand-tagline">Hecho para antojarse</span>
  </div>
</header>

<main class="menu">

  <!-- COMIDA -->
  <section class="card" data-card="comida">
    <button class="card-head" data-toggle="comida" aria-expanded="false" aria-controls="panel-comida">
      <span class="card-index" aria-hidden="true">01</span>
      <span class="card-title">
        <span class="card-title-main">La carta</span>
        <span class="card-title-sub">Comida &amp; burgers</span>
        <span class="card-detail">2 páginas · toca para explorar</span>
      </span>
      <span class="chevron" aria-hidden="true"></span>
    </button>
    <div class="card-panel" id="panel-comida" role="region">
      <div class="gallery" data-gallery="comida">
        <div class="gallery-info"><span>Carta completa</span><span data-page></span></div>
        <div class="gallery-stage">
          <button class="gallery-arrow gallery-arrow-prev" data-prev aria-label="Ver página anterior">‹</button>
          <div class="gallery-track" data-track></div>
          <button class="gallery-arrow gallery-arrow-next" data-next aria-label="Ver página siguiente">›</button>
        </div>
        <div class="gallery-dots" data-dots></div>
      </div>
    </div>
  </section>

  <!-- MICHELADAS -->
  <section class="card" data-card="micheladas">
    <button class="card-head" data-toggle="micheladas" aria-expanded="false" aria-controls="panel-micheladas">
      <span class="card-index" aria-hidden="true">02</span>
      <span class="card-title">
        <span class="card-title-main">Para brindar</span>
        <span class="card-title-sub">Micheladas</span>
        <span class="card-detail">Muy pronto en la carta</span>
      </span>
      <span class="chevron" aria-hidden="true"></span>
    </button>
    <div class="card-panel" id="panel-micheladas" role="region">
      <div class="gallery" data-gallery="micheladas">
        <div class="gallery-track" data-track></div>
        <div class="gallery-dots" data-dots></div>
      </div>
    </div>
  </section>

  <!-- INSTAGRAM -->
  <a class="card card-link" href="https://www.instagram.com/santoburger_vp/" target="_blank" rel="noopener">
    <span class="card-head">
      <span class="card-index" aria-hidden="true">03</span>
      <span class="card-title">
        <span class="card-title-main">La comunidad</span>
        <span class="card-title-sub">Síguenos en Instagram</span>
        <span class="card-detail">@santoburger_vp</span>
      </span>
      <span class="chevron chevron-external" aria-hidden="true"></span>
    </span>
  </a>

</main>

<footer class="foot">
  <span class="halo-mark" aria-hidden="true"></span>
  <p>Santo Burger · Grill and Fries</p>
</footer>

<!-- Lightbox -->
<div class="lightbox" data-lightbox aria-hidden="true">
  <button class="lightbox-nav lightbox-prev" data-lightbox-prev aria-label="Imagen anterior">‹</button>
  <button class="lightbox-close" data-lightbox-close aria-label="Cerrar">&times;</button>
  <div class="lightbox-image-wrap"><img data-lightbox-img src="" alt=""></div>
  <button class="lightbox-nav lightbox-next" data-lightbox-next aria-label="Imagen siguiente">›</button>
  <div class="lightbox-tools" aria-label="Controles de zoom">
    <button data-zoom-out aria-label="Alejar">−</button>
    <span data-zoom-label>100%</span>
    <button data-zoom-in aria-label="Acercar">+</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
